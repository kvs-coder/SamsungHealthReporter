name: Release

on:
  push:
    branches: [ master ]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-26.04
    steps:
      # A PAT / GitHub App token in RELEASE_PLEASE_TOKEN lets the release PR and its pushes trigger CI;
      # with the default GITHUB_TOKEN, CI doesn't run on the release PR.
      - id: release
        uses: googleapis/release-please-action@v5
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || github.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      - name: Checkout release PR
        if: ${{ steps.release.outputs.pr }}
        uses: actions/checkout@v7
        with:
          ref: ${{ fromJSON(steps.release.outputs.pr).headBranchName }}
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || github.token }}

      # release-please writes '## [X.Y.Z](compare-url) (yyyy-MM-dd)';
      # the project format, checked by CI, is '## [X.Y.Z] - dd.MM.yyyy.'.
      - name: Format CHANGELOG.md headers
        if: ${{ steps.release.outputs.pr }}
        run: |
          sed -E -i 's/^## \[?([0-9]+\.[0-9]+\.[0-9]+)\]?(\([^)]*\))? \(([0-9]{4})-([0-9]{2})-([0-9]{2})\)$/## [\1] - \5.\4.\3./' CHANGELOG.md
          if ! git diff --quiet CHANGELOG.md; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "chore: format changelog" CHANGELOG.md
            git push
          fi
